[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener with Redis-cached redirects and ClickHouse click analytics"
readme = "README.md"
# 3.12, not the host's 3.14: aiokafka and asyncpg wheel availability lags new releases.
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Postgres — source of truth
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Redis — cache and rate limiter
    "redis>=5.2",
    # Kafka — click event transport. The lz4 extra is required, not an optimisation:
    # aiokafka raises at construction if the codec its compression_type names is absent.
    "aiokafka[lz4]>=0.12",
    # ClickHouse — analytics read path only
    "clickhouse-connect>=0.8",
    # Enrichment. maxminddb's pure-Python fallback is ~10x slower than its C
    # extension; app/events/enrichment.py checks and logs at startup.
    "ua-parser[regex]>=1.0",
    "geoip2>=4.8",
    # Auth
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Pinned explicitly, or ruff walks up to an ambient config and local formatting
# drifts from CI.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness — blocking calls in async defs
    "S",         # bandit security
    "RUF",
]
ignore = [
    "S104",  # binding 0.0.0.0 is correct inside a container
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the point
    "S106",  # fixture credentials are literals by design; they reach no real service
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "clickhouse_connect.*", "geoip2.*", "ua_parser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Postgres/Redis (deselect with -m 'not integration')",
    # Separate from `integration` because GitHub Actions `services:` cannot mount
    # volumes, so the CI test job cannot stand up a ClickHouse matching compose's.
    # These run in the build job, against the real stack.
    "analytics_integration: also requires Kafka/ClickHouse and applied ClickHouse migrations",
]

[tool.coverage.run]
# Alembic lives in `migrations/` at the repo root, outside source — no `omit` needed.
# Pass `--cov` with no argument in CI or this is ignored.
source = ["app", "scripts"]
